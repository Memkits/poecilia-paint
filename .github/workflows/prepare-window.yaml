name: Protected Poecilia Window and formal graph migration
on:
  push:
    branches: [prepare/poecilia-window-0301]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6.5.0
        with:
          node-version: 24
          package-manager-cache: false
      - uses: calcit-lang/setup-calcit@v1.5.0
        with:
          tools: calcit,caps
          deps-file: deps.cirru
          caps-version: "0.1.1"
      - name: Exact original gates and reviewed source transaction
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare yarn@4.18.0 --activate
          yarn install --immutable
          mkdir -p acceptance
          test ! -e compact.cirru
          test ! -e package.cirru
          for phase in before after; do
            if [[ "$phase" == after ]]; then node prepare-window.mjs apply; fi
            caps --ci --strict
            caps verify --toolchain
            source_blob="$(git hash-object calcit.cirru)"
            calcit edit format
            test "$(git hash-object calcit.cirru)" = "$source_blob"
            node prepare-window.mjs "$phase"
            calcit --check-only --all-defs --format json > "acceptance/${phase}-all-defs.json"
            calcit fix --workflow strict --verify --format json > "acceptance/${phase}-strict.json"
            jq -e '.data.workflow.status == "passed" and .diagnostics == []' "acceptance/${phase}-strict.json"
            VITE_BASE_URL=./ yarn build
            node --test tests/paint.test.mjs > "acceptance/${phase}-node-tests.log"
            node prepare-window.mjs "${phase}-js"
          done
          git diff --exit-code -- yarn.lock package.json
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: accepted-source
          path: |
            calcit.cirru
            deps.cirru
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          name: accepted-runtime
          path: |
            js-out/
            dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: diagnostics
          path: acceptance/
          if-no-files-found: warn
